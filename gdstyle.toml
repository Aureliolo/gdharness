# The GDScript style, read by gdstyle's check and its formatter's diff, with every finding failing
# the gate (`--max-warnings 0`). The gate hands gdstyle every script by name, so `exclude` decides
# nothing here.

# Matches ruff, so Python and GDScript wrap at the same column. A tab counts four, as the editor
# shows it.
max_line_length = 100

# gdstyle's default is 5. Six counts a static function's too.
max_parameters = 6

# The style guide's own line: a number under a million reads without separators (ids, seeds, sample
# rates).
large_number_threshold = 1_000_000

[rules]
# Tests stepping frames and sequential awaits are written so.
"quality/await-in-loop" = "off"
# Tests and builders make objects in a loop by design.
"quality/allocation-in-loop" = "off"
# Every finding was a false positive: the rule ignores the receiver (`hand[0].upgraded = upgraded`).
"quality/no-self-assign" = "off"
# A folder prefix joined with names reads as the same path loaded twice.
"quality/duplicated-load" = "off"
# gdstyle 0.5.0 flags an `elif` after a branch that returns only on some paths (`if a:` holding
# `if b: return 1`), where obeying it changes what the function does.
"quality/no-else-return" = "off"
# A function's size is held by lizard's complexity ceiling (`lint:gd:complexity`). A second budget
# counted another way would argue with it.
"quality/max-function-length" = "off"
"quality/max-local-variables" = "off"
"quality/max-nesting-depth" = "off"
"quality/max-returns" = "off"
"quality/max-branches" = "off"
# The same for a class: its size is its script's code size. Counted another way they would split
# static helper modules and settings pages for nothing.
"quality/max-class-variables" = "off"
"quality/max-public-methods" = "off"
"quality/max-inner-classes" = "off"
# A script's lines counted with its comments: a cap on all of them is a budget on the comments
# saying why, and shortening one splits no code.
"quality/max-file-length" = "off"
