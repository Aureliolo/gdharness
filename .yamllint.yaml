# Every rule yamllint has, at its default, with the ones GitHub Actions and Renovate cannot
# meet set to what the files actually are: a workflow's top-level key is `on`, which the
# truthy rule reads as a boolean; a workflow does not open with `---`; the comment beside a
# pinned action, `uses: x@<sha> # v1.2.3`, is one space in, which is how Renovate writes it
# back; and a Renovate marker carrying a versioning regex is one comment line of up to 160
# characters that cannot be wrapped, because Renovate reads it as one line. The longest of them
# is the mcp-publisher pin, whose repository name is `modelcontextprotocol/registry`.
extends: default

rules:
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  line-length:
    max: 160
    allow-non-breakable-inline-mappings: true

ignore:
  - node_modules/
  - .venv/
  - build/
  - dist/
