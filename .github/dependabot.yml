version: 2

# One pull request for everything, across both ecosystems. Dependencies here are pinned to exact
# versions and the branch wants every check green before anything merges, so a bump that arrives
# in five pieces is five rounds of CI to land one week's updates.
multi-ecosystem-groups:
  everything:
    schedule:
      interval: weekly
    commit-message:
      prefix: deps

updates:
  # `bun`, not `npm`. The lockfile here is bun.lock, and Dependabot's npm handler does not know
  # how to update one: it rewrites package.json, leaves the lockfile behind, and every job then
  # fails on `bun install --frozen-lockfile`. That is dependabot-core#14223, and their own npm
  # handler has a warning for exactly this misconfiguration.
  - package-ecosystem: bun
    directory: /
    patterns: ['*']
    multi-ecosystem-group: everything
    # A compromised release is usually caught within days of publication, and a bot that takes a
    # version the hour it appears is the fastest possible way to install one.
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Digests, not tags: the repository requires SHA-pinned actions, and Dependabot keeps the
  # version comment beside the digest when it bumps one.
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: everything
    cooldown:
      default-days: 7
