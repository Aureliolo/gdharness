name: Release

# The tag is created by the tag workflow with the job token, and an event caused by that token
# starts no workflow, so a push trigger alone would never fire; the tag workflow dispatches
# this one on the tag instead. The push trigger stays for a tag pushed by hand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions: {}

# Keyed on the tag rather than the workflow, and never cancelled: two tags are two releases
# and must both run, while the same tag twice is a re-run that should not race itself.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Building, testing, the SBOM and the signing all happen in release-build.yml, so the
  # identity Sigstore certifies is those build steps rather than this file's; see there.
  build:
    name: build
    if: github.repository == 'Aureliolo/gdharness'
    permissions:
      contents: read # The build reads the tagged source.
      id-token: write # Only release-build.yml's attest job uses it, to sign.
      attestations: write # Only release-build.yml's attest job uses it, to store the provenance.
      # A called workflow cannot ask for more than its caller was given, and a job inside it that
      # does stops the whole run before a single step executes: `startup_failure`, no logs, and a
      # tag left standing with no release behind it. Granting it here is not optional once
      # release-build.yml's build_test job declares it.
      pull-requests: read # Only release-build.yml's build_test job uses it, to write the changelog.
    # zizmor wants `$/...` here. actionlint 1.7.12 rejects that spelling as neither of the two
    # forms GitHub documents, and this path only runs on a tag, where a syntax error is a failed
    # release rather than a failed check. The two linters disagree; the one that can be verified
    # against a real parser wins. Worth revisiting when actionlint knows the shorthand.
    uses: ./.github/workflows/release-build.yml # zizmor: ignore[self-repository]

  publish:
    name: publish
    if: github.repository == 'Aureliolo/gdharness'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write # Creates the release and uploads the assets onto it.

    steps:
      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist

      - name: Download the signed attestations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestations
          path: dist

      - name: Download the changelog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-changelog
          path: notes

      # The bytes have moved between jobs twice by now, and they are the bytes the attestation
      # was made over, so the last thing before publishing is to check they still hash right.
      - name: Verify the checksum once more
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check "gdharness-${VERSION}.tgz.sha256")

      # The file that ships has to verify the way a user will run it, from the file alone, and
      # has to name release-build.yml at this tag as the builder; otherwise it only looks like
      # proof.
      - name: Verify the attestations that will ship
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          bundle="dist/gdharness-${VERSION}.intoto.jsonl"
          signer="${GITHUB_REPOSITORY}/.github/workflows/release-build.yml"
          for subject in "gdharness-${VERSION}.tgz" "gdharness-${VERSION}.tgz.sha256" "gdharness-${VERSION}.spdx.json"; do
            gh attestation verify "dist/${subject}" --bundle "${bundle}" \
              --repo "${GITHUB_REPOSITORY}" --signer-workflow "${signer}" \
              --source-ref "${GITHUB_REF}" --deny-self-hosted-runners
          done
          gh attestation verify "dist/gdharness-${VERSION}.tgz" --bundle "${bundle}" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --repo "${GITHUB_REPOSITORY}" --signer-workflow "${signer}" \
            --source-ref "${GITHUB_REF}" --deny-self-hosted-runners

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # printf rather than a heredoc: an unquoted heredoc runs the backticks in the code
          # fences as commands, and a quoted one cannot see VERSION. Single quotes keep the
          # fences literal, double quotes take the version.
          printf '%s\n' \
            '## Install' \
            '' \
            'Point your agent at <https://aureliolo.github.io/gdharness>, or do it yourself:' \
            '' \
            '```bash' \
            "npx -y gdharness@${VERSION} setup" \
            '```' \
            '' \
            '## Upgrade from an earlier version' \
            '' \
            '```bash' \
            "npx -y gdharness@${VERSION} upgrade" \
            '```' \
            '' \
            'Then restart the editor so it loads the new addons, and reconnect the MCP server so' \
            'your harness spawns this version.' \
            '' \
            '[Install guide](https://aureliolo.github.io/gdharness/install.html)' \
            '· [What it writes](https://aureliolo.github.io/gdharness/architecture.html)' \
            '· [Tools](https://aureliolo.github.io/gdharness/tools.html)' \
            '' \
            > notes.md
          # Written by the build job from the files each pull request touched, rather than by
          # --generate-notes, which lists every title together and leaves a reader to guess which
          # of them reach the machine they install onto. Two projects guessed wrong the same way
          # on the same day.
          cat notes/changelog.md >> notes.md
          gh release create "${GITHUB_REF_NAME}" \
            "dist/gdharness-${VERSION}.tgz" \
            "dist/gdharness-${VERSION}.tgz.sha256" \
            "dist/gdharness-${VERSION}.spdx.json" \
            "dist/gdharness-${VERSION}.intoto.jsonl" \
            --verify-tag \
            --notes-file notes.md \
            --title "gdharness ${VERSION}"

  # npm is how every harness actually installs a server: each one's config is some spelling of
  # `npx -y gdharness@VERSION`. The archive published here is the one the attest job signed, so
  # the Sigstore attestation and the SBOM cover the bytes npm serves, and npm adds its own
  # provenance on top. Runs after the release so a published npm version always has a release
  # behind it to verify against.
  #
  # Publishing is tokenless: npm's trusted publisher for this package names this workflow, and
  # the OIDC token below is the whole credential. There is no npm token anywhere, and the package
  # is set to disallow the bypass-2FA tokens that would be the way round that.
  #
  # A brand new package name cannot start this way. npm will not hold a trusted publisher for a
  # name nobody has published (npm/cli#8544), so 0.4.1 went out with a short-lived token, which
  # was deleted as soon as the publisher was configured.
  npm:
    name: npm
    if: github.repository == 'Aureliolo/gdharness'
    needs: [build, publish]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      id-token: write # npm's trusted publishing takes this instead of a token, and signs provenance with it.

    steps:
      - name: Download the bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
          path: dist

      - name: Verify the checksum once more
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check "gdharness-${VERSION}.tgz.sha256")

      # Trusted publishing needs npm 11.5.1 or newer and the runner ships 10.9.8. The npm that
      # comes with a pinned Node is the way to get one: installing a package into the job that
      # holds id-token would be an unpinned fetch in the one place it matters most.
      # renovate: datasource=node-version depName=node
      - name: Node, for an npm new enough to publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          # Nothing is installed here, only a prebuilt archive published, so a cache would carry
          # no benefit and would be a way into the one job that holds id-token.
          package-manager-cache: false

      - name: Publish to npm
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Checked rather than assumed: too old an npm publishes with no provenance and says
          # nothing about it, which is the one failure that would not be noticed.
          required=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "${required}" "${have}" | sort -V | head -1)" != "${required}" ]; then
            echo "npm ${have} cannot use trusted publishing; ${required} or newer is needed." >&2
            exit 1
          fi

          # ./ and not dist/: npm reads a bare `a/b` as a GitHub shorthand, so the plain path sends
          # it looking for ssh://git@github.com/dist/gdharness-X.Y.Z.tgz.git rather than at the
          # archive sitting right there. The leading ./ is what makes it a path.
          archive="./dist/gdharness-${VERSION}.tgz"

          # No token anywhere: the OIDC token this job asked for is the credential, and npm
          # generates and publishes its own provenance attestation from it without being asked.
          npm publish "${archive}" --access public

      # The claim made in the documentation is that what npm serves is the archive this repository
      # signed, so somebody can install from npm and verify against the release bundle. That is
      # only true if the registry stores the bytes it was given, which is checked rather than
      # assumed: if npm ever repacks, this fails on the release that first did it.
      - name: The published tarball is the archive that was signed
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(cut -d' ' -f1 < "dist/gdharness-${VERSION}.tgz.sha256")"

          # The registry takes a moment to serve a version it has just accepted, and a first
          # publish takes longer still: this answered 404 for gdharness@0.4.1 seconds after
          # publishing it, for a package that was there all along. Asked again rather than read
          # as a verdict, because "not found yet" and "not published" look identical here, and
          # asked online each time because a packument that missed is cached for five minutes.
          url=""
          for attempt in $(seq 1 30); do
            if url="$(npm view --prefer-online "gdharness@${VERSION}" dist.tarball 2>/dev/null)" && [ -n "${url}" ]; then
              break
            fi
            echo "The registry does not serve ${VERSION} yet; asked ${attempt} times."
            sleep 10
          done

          if [ -z "${url}" ]; then
            echo "The registry never served gdharness@${VERSION}, five minutes after publishing it." >&2
            exit 1
          fi

          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --retry-delay 2 \
            "${url}" -o published.tgz
          actual="$(sha256sum published.tgz | cut -d' ' -f1)"

          if [[ "${expected}" != "${actual}" ]]; then
            echo "npm serves ${actual}; the signed archive is ${expected}." >&2
            echo "The attestation no longer covers what npm hands out. Fix the docs or the job." >&2
            exit 1
          fi
          echo "npm serves the signed archive: ${actual}."

  # Publishing is not installing. Everything above reads the bytes the registry holds; nothing
  # runs them, and the two come apart: a `files` list missing an entry, a bin that does not
  # resolve, a shebang the runtime will not take, a bundle that only Bun can load. Each of those
  # publishes green and installs broken, and the first to know is whoever typed the line out of
  # the documentation.
  #
  # So it is typed here first, on every platform it is documented for, against the version that
  # was published a minute ago. It reports rather than gates: npm is immutable and the release
  # exists by the time this runs, so a red job is the signal to cut a patch. Knowing is the part
  # that was missing.
  installs:
    name: installs (${{ matrix.platform }})
    if: github.repository == 'Aureliolo/gdharness'
    needs: [build, npm]
    strategy:
      fail-fast: false
      matrix:
        # Renovate reads a runner out of `runs-on:` but not out of a matrix, so each of these
        # carries its own line for it.
        include:
          - platform: linux
            # renovate: datasource=github-runners depName=ubuntu
            runner: ubuntu-26.04
          - platform: windows
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
          - platform: macos
            # renovate: datasource=github-runners depName=macos
            runner: macos-26

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    # A packument is cached for five minutes once fetched, so the first ask that missed is what
    # every later one in the job is answered from. On the job rather than on the step that waits,
    # because npx resolves for itself and reaches the registry again: the wait held `--prefer-online`
    # alone and npx, one step later, did not.
    env:
      npm_config_prefer_online: 'true'

    steps:
      # The registry is eventually consistent and every runner resolves against whichever edge it
      # lands on, so one runner having seen the version says nothing about the next: 0.6.3 was
      # published, the job above downloaded its tarball from the registry, and the linux runner
      # here was told there was no such version. Each platform waits for the edge it is going to
      # install from rather than for the one that published.
      #
      # Waited on with the command the steps below run, rather than with `npm view`. Those are two
      # resolvers asking the registry separately and passing one says nothing about the other: on
      # 0.9.1 `npm view` served the version on its first ask and npx was told there was no such
      # version 0.97 seconds later. Asking with npx also leaves the package where npx looks, so
      # what the steps below read is what this step proved.
      - name: Wait for the registry this runner reads
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if npx -y "gdharness@${VERSION}" --version > /dev/null 2>&1; then
              echo "The registry serves ${VERSION} to npx here; asked ${attempt} times."
              exit 0
            fi
            echo "The registry does not serve ${VERSION} to npx here yet; asked ${attempt} times."
            sleep 10
          done
          echo "The registry here never served gdharness@${VERSION}, five minutes after publishing it." >&2
          exit 1

      # No checkout: a reader has none of this repository, and anything taken from it here would
      # be a thing the published package was not asked for.
      - name: The published line says who it is
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          said="$(npx -y "gdharness@${VERSION}" --version)"
          if [ "${said}" != "gdharness v${VERSION}" ]; then
            echo "npx -y gdharness@${VERSION} --version said: ${said}" >&2
            exit 1
          fi
          echo "${said}"

      - name: And reads the project it is pointed at
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          project="${RUNNER_TEMP}/fixture"
          mkdir -p "${project}"
          printf 'config_version=5\n' > "${project}/project.godot"
          cd "${project}"

          # doctor starts no engine, so this holds on a runner with no Godot on it. A bare project
          # has problems and exit 1 is how it says so; 2 would mean the command itself was
          # refused, which is the failure worth telling apart from a project that needs setup.
          status=0
          report="$(npx -y "gdharness@${VERSION}" doctor --json)" || status=$?
          if [ "${status}" != "1" ]; then
            echo "doctor on a bare project exited ${status}:" >&2
            printf '%s\n' "${report}" >&2
            exit 1
          fi
          printf '%s' "${report}" | jq -e '.problems | length > 0' > /dev/null
          echo "doctor read the project and named $(printf '%s' "${report}" | jq -r '.problems | length') problems."

  # The official MCP registry is the record every marketplace downstream of it reads: they scrape
  # its server list on their own schedule and show whatever it holds. So a registry entry that
  # lags the releases is a stale listing everywhere at once, and the only way it does not lag is
  # for the tag to publish it.
  #
  # Tokenless, like npm above: the registry has no accounts and no API keys. It grants the
  # `io.github.Aureliolo/*` namespace to whatever the OIDC token below proves this workflow is,
  # and refuses that namespace to anything else.
  #
  # Last, after npm, because the registry checks that the package server.json names really exists
  # at this version and carries an `mcpName` matching the server name. Run this any earlier and
  # that check fails on a package that is seconds from existing.
  registry:
    name: MCP registry
    if: github.repository == 'Aureliolo/gdharness'
    needs: [build, publish, npm]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads server.json at the tag, which is the thing being published.
      id-token: write # The registry takes this instead of a token, the way npm does above.

    # On the job rather than beside the step that reads it: the marker Renovate needs carries a
    # versioning regex, and four more columns of indentation put that one unwrappable line past
    # what every other line here is held to.
    env:
      # renovate: datasource=github-release-attachments depName=modelcontextprotocol/registry versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
      MCP_PUBLISHER_TAG: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release archive, refused unless it matches the digest written here. The documented
      # install line fetches `releases/latest` and verifies nothing, which is not something to run
      # in a job that holds id-token.
      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 3 --retry-all-errors --retry-delay 2 -o "${archive}" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_TAG}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" mcp-publisher

      # server.json is not edited here. bump-version.ts writes the version into it, and both
      # release-tag.yml and release-build.yml refuse a tag where it disagrees with package.json,
      # so the file at this commit already names this release. `validate` is the cheap proof of
      # that before a publish that would otherwise fail with the entry half made.
      - name: Publish to the MCP registry
        shell: bash
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/mcp-publisher" validate
          "${RUNNER_TEMP}/mcp-publisher" login github-oidc
          "${RUNNER_TEMP}/mcp-publisher" publish

      # Read back what the registry serves rather than believe what the publish printed, which is
      # the rule every tool here is held to. A version that published but is not served reaches
      # nobody, and would otherwise surface weeks later as a marketplace showing an old version.
      - name: The registry serves this version
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Read from the manifest rather than written twice: a name that drifts from server.json
          # would check some other server, or nothing, and pass either way.
          name="$(jq -er '.name' server.json)"
          url="https://registry.modelcontextprotocol.io/v0.1/servers/${name//\//%2F}/versions/${VERSION}"

          # A version the registry has just accepted takes a moment to be served, and "not yet"
          # and "never" look identical from here, so it is asked again rather than read as a
          # verdict the first time.
          body=""
          for attempt in $(seq 1 12); do
            if body="$(curl -fsSL --proto '=https' --tlsv1.2 "${url}")" && [ -n "${body}" ]; then
              break
            fi
            echo "The registry does not serve ${VERSION} yet; asked ${attempt} times."
            body=""
            sleep 5
          done

          if [ -z "${body}" ]; then
            echo "The registry never served ${name} ${VERSION}, a minute after publishing it." >&2
            exit 1
          fi

          # The version, the package it sends clients to, and that this is the version they get
          # when they ask for the latest one. An entry pointing at the wrong package installs
          # somebody else's server on somebody's machine.
          served="$(printf '%s' "${body}" | jq -er '
            [.server.version,
             .server.packages[0].identifier + "@" + .server.packages[0].version,
             (._meta["io.modelcontextprotocol.registry/official"].isLatest | tostring)]
            | join(" ")')"
          package="$(jq -er '.packages[0].identifier' server.json)"
          expected="${VERSION} ${package}@${VERSION} true"

          if [ "${served}" != "${expected}" ]; then
            echo "The registry serves: ${served}" >&2
            echo "Expected:            ${expected}" >&2
            exit 1
          fi
          echo "The registry serves ${name} ${VERSION}, pointing at gdharness@${VERSION}."
