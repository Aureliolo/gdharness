name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  build_test:
    if: github.repository == 'Aureliolo/gdharness'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" main:refs/remotes/origin/main
          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "${release_commit}" origin/main; then
            echo "Release commit ${release_commit} is not reachable from origin/main." >&2
            exit 1
          fi

      # The branch ruleset requires signed commits on main, so this only fails if that
      # ruleset was bypassed or removed. That is exactly when you want to hear about it.
      - name: Verify the release commit is signed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.verification.verified')"
          reason="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.commit.verification.reason')"
          if [[ "${verified}" != "true" ]]; then
            echo "Release commit ${GITHUB_SHA} carries no valid signature: ${reason}" >&2
            exit 1
          fi

      - name: Setup Bun
        # No version pinned here on purpose: setup-bun reads packageManager out of
        # package.json, which is the one place the Bun version is written.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag and metadata versions
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(bun -e "console.log((await Bun.file('package.json').json()).version)")"
          server_version="$(bun -e "console.log((await Bun.file('server.json').json()).version)")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            exit 1
          fi

          if [[ "${server_version}" != "${package_version}" ]]; then
            echo "server.json version ${server_version} does not match package version ${package_version}." >&2
            exit 1
          fi

          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
        id: version

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Runtime regression tests
        run: bun run test:ci

      - name: Dynamic groups test
        run: bun run test:dynamic-groups

      - name: Metadata consistency tests
        run: bun run test:metadata

      - name: Packaging test
        run: bun run test:packaging

      - name: Audit production dependencies
        run: bun audit --prod

      - name: Verify clean source and build release assets
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "Tests or build steps modified the checked-out release source." >&2
            git status --short >&2
            exit 1
          fi

          rm -rf dist
          bun run release:pack

          version="${{ steps.version.outputs.version }}"
          archive="dist/gdharness-${version}.tgz"
          checksum="${archive}.sha256"

          if [[ ! -s "${archive}" || ! -s "${checksum}" ]]; then
            echo "Release archive or checksum is missing or empty." >&2
            exit 1
          fi

          expected_assets="$(printf '%s\n' "${archive}" "${checksum}")"
          actual_assets="$(find dist -maxdepth 1 -type f -print | sort)"
          if [[ "${actual_assets}" != "${expected_assets}" ]]; then
            echo "dist contains stale or unexpected release assets." >&2
            printf '%s\n' "${actual_assets}" >&2
            exit 1
          fi

          (cd dist && sha256sum --check "$(basename "${checksum}")")

          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"
        id: assets

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.checksum }}
          if-no-files-found: error
          retention-days: 1

  # The SBOM is built from the archive rather than from the source tree, so what it lists is
  # what ships rather than what the build happened to have lying around.
  sbom:
    if: github.repository == 'Aureliolo/gdharness'
    needs: build_test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}

    steps:
      - name: Download release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: dist

      - name: Verify downloaded release assets
        shell: bash
        env:
          VERSION: ${{ needs.build_test.outputs.version }}
        run: |
          set -euo pipefail
          archive="dist/gdharness-${VERSION}.tgz"
          checksum="${archive}.sha256"

          expected_assets="$(printf '%s\n' "${archive}" "${checksum}")"
          actual_assets="$(find dist -maxdepth 1 -type f -print | sort)"
          if [[ "${actual_assets}" != "${expected_assets}" ]]; then
            echo "Downloaded artifact contains unexpected release assets." >&2
            printf '%s\n' "${actual_assets}" >&2
            exit 1
          fi

          (cd dist && sha256sum --check "$(basename "${checksum}")")

      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/gdharness-${{ needs.build_test.outputs.version }}.tgz
          format: spdx-json
          output-file: dist/gdharness-${{ needs.build_test.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Upload the bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-bundle
          path: |
            dist/gdharness-${{ needs.build_test.outputs.version }}.tgz
            dist/gdharness-${{ needs.build_test.outputs.version }}.tgz.sha256
            dist/gdharness-${{ needs.build_test.outputs.version }}.spdx.json
          if-no-files-found: error
          retention-days: 1

  attest:
    if: github.repository == 'Aureliolo/gdharness'
    needs: [build_test, sbom]
    permissions:
      id-token: write
      attestations: write
    uses: ./.github/workflows/attest.yml
    with:
      artifact: release-bundle
      archive: dist/gdharness-${{ needs.build_test.outputs.version }}.tgz
      sbom: dist/gdharness-${{ needs.build_test.outputs.version }}.spdx.json
      subjects: |
        dist/gdharness-${{ needs.build_test.outputs.version }}.tgz
        dist/gdharness-${{ needs.build_test.outputs.version }}.tgz.sha256
        dist/gdharness-${{ needs.build_test.outputs.version }}.spdx.json

  publish:
    if: github.repository == 'Aureliolo/gdharness'
    needs: [build_test, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download the bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-bundle
          path: dist

      # The bytes have moved between jobs twice by now, and they are the bytes the attestation
      # was made over, so the last thing before publishing is to check they still hash right.
      - name: Verify the checksum once more
        shell: bash
        env:
          VERSION: ${{ needs.build_test.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check "gdharness-${VERSION}.tgz.sha256")

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build_test.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "dist/gdharness-${VERSION}.tgz" \
            "dist/gdharness-${VERSION}.tgz.sha256" \
            "dist/gdharness-${VERSION}.spdx.json" \
            --verify-tag \
            --generate-notes \
            --title "gdharness ${VERSION}"
