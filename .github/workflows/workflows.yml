name: Workflows

# The workflows themselves are code with credentials attached. actionlint covers syntax,
# expressions and the shell inside run: blocks; zizmor covers the security side, template
# injection and over-broad permissions. They are complementary and the guidance is to run both.
#
# No paths filter. Both are required checks, and a required check that a paths filter stopped
# from running never reports, which leaves the pull request waiting on it forever. Between them
# they take under half a minute.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the workflow files; it writes results nowhere but the log.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        # The release archive, refused unless it matches the digest written here, rather than
        # the project's installer script, which verifies nothing. shellcheck and pyflakes come
        # with the runner image, so the shell inside run: blocks is checked too.
        env:
          # renovate: datasource=github-release-attachments depName=rhysd/actionlint versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
          ACTIONLINT_TAG: v1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/actionlint_${ACTIONLINT_TAG#v}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 2 -o "${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/${ACTIONLINT_TAG}/actionlint_${ACTIONLINT_TAG#v}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # Reads the workflow files.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        # Findings fail the job rather than going to the security tab. A lint result is not a
        # vulnerability report to be triaged later: it is either fixed or argued about in the
        # pull request that introduced it, and a red check says that where a dismissable alert
        # does not. `advanced-security: false` is what turns annotations on and the upload off.
        #
        # No version input: the action runs zizmor from a container image whose digest is written
        # into the action at the commit pinned here, so the zizmor version is fixed by that pin
        # and moves with it. A version named here could only ever lag or repeat that.
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          persona: pedantic
          advanced-security: false
          annotations: true
