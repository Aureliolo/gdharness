name: Workflows

# The workflows themselves are code with credentials attached. actionlint covers syntax,
# expressions and the shell inside run: blocks; zizmor covers the security side, template
# injection and over-broad permissions. They are complementary and the guidance is to run both.
#
# No paths filter. Both are required checks, and a required check that a paths filter stopped
# from running never reports, which leaves the pull request waiting on it forever. Between them
# they take under half a minute.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Reads the workflow files; it writes results nowhere but the log.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        # Pinned by digest like everything else. shellcheck and pyflakes come with the
        # runner image, so the shell inside run: blocks is checked too.
        run: |
          set -euo pipefail
          curl -fsSL --proto '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash \
            -o download-actionlint.bash
          echo "Downloaded actionlint installer"
          bash download-actionlint.bash 1.7.12
          ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Reads the workflow files.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        # Findings fail the job rather than going to the security tab. A lint result is not a
        # vulnerability report to be triaged later: it is either fixed or argued about in the
        # pull request that introduced it, and a red check says that where a dismissable alert
        # does not. `advanced-security: false` is what turns annotations on and the upload off.
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          persona: pedantic
          advanced-security: false
          annotations: true
