name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta

permissions:
  contents: read

# A superseded run on the same ref tells you nothing the newer one will not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is mechanical and always enforceable, so it gates from day one.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        # No version pinned here on purpose: setup-bun reads packageManager out of
        # package.json, which is the one place the Bun version is written.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  # Both linters run against a codebase that has never been linted, so these are expected
  # to be red until the tool boundary is typed. They are separate jobs and not required
  # checks, so the failure is visible rather than hidden, and it blocks nothing yet.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        # No version pinned here on purpose: setup-bun reads packageManager out of
        # package.json, which is the one place the Bun version is written.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint:biome

      - name: ESLint, type-aware
        if: '!cancelled()'
        run: bun run lint:eslint

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Setup Bun
        # No version pinned here on purpose: setup-bun reads packageManager out of
        # package.json, which is the one place the Bun version is written.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Runtime regression tests
        run: bun run test:ci

      - name: Dynamic groups test
        run: bun run test:dynamic-groups

      - name: Metadata consistency tests
        run: bun run test:metadata

      - name: Packaging test
        run: bun run test:packaging

      - name: Audit production dependencies
        run: bun audit --prod
