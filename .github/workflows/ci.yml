name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta

permissions:
  contents: read

# A superseded run on the same ref tells you nothing the newer one will not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is mechanical and always enforceable, so it gates from day one.
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  # The GDScript is what runs inside a user's engine, so it gets the same treatment as the
  # TypeScript in front of it.
  gdscript:
    name: gdscript
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv rather than setup-python and pip: setup-python fetches an interpreter by version and
      # checks nothing about it, and pip trusts whatever the index serves. uv is the one download
      # done on trust here, and it is refused unless it matches the digest written below; the
      # interpreter it then installs is checked against the hashes uv itself carries, and every
      # package against the hashes in uv.lock.
      - name: Install uv
        env:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv versioning=semver
          UV_TAG: 0.12.13
          UV_SHA256: 745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 2 -o "${archive}" \
            "https://github.com/astral-sh/uv/releases/download/${UV_TAG}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"

      # --locked refuses a uv.lock that no longer matches pyproject.toml instead of re-resolving,
      # and the interpreter is the one pyproject.toml pins.
      - name: Install gdtoolkit
        env:
          # The interpreter uv downloads and verifies, never one the runner image happens to have.
          UV_MANAGED_PYTHON: '1'
        run: |
          set -euo pipefail
          uv sync --locked
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      # Bun only runs the package scripts, so the directories gdformat and gdlint cover are
      # written once, in package.json, and are the same here as on a developer's machine.
      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Check formatting
        run: bun run format:gd:check

      - name: Lint
        if: '!cancelled()'
        run: bun run lint:gd

  # The workflows are linted by actionlint and zizmor for what they do; this is for what every
  # YAML file here is as YAML, the syft and yamllint configs included. yamllint is Python, so
  # it is installed the way gdtoolkit is above.
  yaml:
    name: yaml
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        env:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv versioning=semver
          UV_TAG: 0.12.13
          UV_SHA256: 745765a3b6e360ad76743599ae5c42e9278c7edf8bbff9fc76d05bf2623a04dd
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 2 -o "${archive}" \
            "https://github.com/astral-sh/uv/releases/download/${UV_TAG}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"

      - name: Install yamllint
        env:
          UV_MANAGED_PYTHON: '1'
        run: |
          set -euo pipefail
          uv sync --locked
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Lint
        run: yamllint --strict .

  # The GDScript that ships in the bundle, driven against a real engine on every platform we
  # claim to support. It is a separate job from build-and-test because it is the only one that
  # needs Godot, and running it on one platform would say nothing about the other two: the
  # things it covers, project.godot writing and path handling, are exactly where the platforms
  # differ.
  engine:
    # Named by platform rather than by runner image, because the name is what the branch ruleset
    # requires, and an image bump must not rename a required check out from under it.
    name: engine (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        # Renovate reads a runner out of `runs-on:` but not out of a matrix, so each of these
        # carries its own line for it.
        include:
          - platform: linux
            # renovate: datasource=github-runners depName=ubuntu
            runner: ubuntu-24.04
          - platform: windows
            # renovate: datasource=github-runners depName=windows
            runner: windows-2025
          - platform: macos
            # renovate: datasource=github-runners depName=macos
            runner: macos-26

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      # Ours rather than a setup action's, because the engine is a 180 MB binary and this is the
      # only way to know it is the one the repository pins. It exports GODOT_PATH.
      - name: Install Godot
        run: bun scripts/install-godot.ts

      # The test runner project_test drives, pinned by commit and digest the same way. It
      # exports GDUNIT4_PATH, and the regression that needs it fails rather than skips here.
      - name: Install gdUnit4
        run: bun scripts/install-gdunit4.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Engine fixtures
        run: bun run test:engine
        env:
          # The suite skips when it cannot run Godot, which is right on a contributor's machine
          # and wrong here: without this a broken install would read as a pass.
          GDHARNESS_REQUIRE_GODOT: '1'

      # The regressions that drive the scene tools through the engine skip without one, so they
      # are run again here, where a skip is a failure.
      - name: Regressions that need the engine
        if: '!cancelled()'
        run: bun run build && bun run test:regressions
        env:
          GDHARNESS_REQUIRE_GODOT: '1'

      # The bridge test's ClassDB phase reaches the engine and skips without one, so it is run
      # again here, where a skip is a failure.
      - name: Bridge integration test with the engine
        if: '!cancelled()'
        run: bun run test:integration
        env:
          GDHARNESS_REQUIRE_GODOT: '1'

      # The editor tools, against an editor this starts itself. Nothing else in CI opens one, so
      # without this every scene_* tool, resource_edit and editor_rescan is covered by argument
      # checks alone, which a tool answering plausible nonsense passes as well as a working one.
      - name: Editor fixtures
        if: '!cancelled()'
        run: bun run build && bun run test:editor
        env:
          GDHARNESS_REQUIRE_GODOT: '1'

  # Biome owns formatting and the fast syntactic rules; oxlint owns the ones that need the type
  # checker, which it runs through typescript-go rather than a second copy of the compiler.
  # Separate from build-and-test so a lint failure and a broken build are two different red
  # lights rather than one.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint:biome

      - name: oxlint, type-aware
        if: '!cancelled()'
        run: bun run lint:types

      # A file, export or dependency nothing reaches. Dead code is where the next silent
      # failure hides: it looks maintained and nothing runs it.
      - name: knip
        if: '!cancelled()'
        run: bun run lint:dead

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Restore Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Runtime regression tests
        run: bun run test:ci

      # The bridge, driven against a mock Godot over a real WebSocket.
      - name: Bridge integration test
        run: bun run test:integration

      - name: Metadata consistency tests
        run: bun run test:metadata

      - name: Packaging test
        run: bun run test:packaging

      - name: Audit production dependencies
        run: bun audit --prod
