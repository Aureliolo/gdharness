name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta

permissions:
  contents: read

# A superseded run on the same ref tells you nothing the newer one will not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is mechanical and always enforceable, so it gates from day one.
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  # The GDScript is what runs inside a user's engine, so it gets the same treatment as the
  # TypeScript in front of it.
  gdscript:
    name: gdscript
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv rather than setup-python and pip: setup-python fetches an interpreter by version and
      # checks nothing about it, and pip trusts whatever the index serves. uv is the one download
      # done on trust here, and it is refused unless it matches the digest written below; the
      # interpreter it then installs is checked against the hashes uv itself carries, and every
      # package against the hashes in uv.lock.
      #
      # --retry-all-errors is what makes --retry mean what it looks like it means. On its own,
      # --retry covers timeouts and 5xx and nothing else, so a connection reset mid-handshake is
      # not retried at all: this step went red in 0.16s on `curl: (35) Recv failure: Connection
      # reset by peer`, having tried once. The digest below is unchanged, so what is retried is
      # the download and what is accepted is still one exact archive. Every pinned download in
      # this repository carries the same flags for the same reason.
      #
      # Six retries on curl's own doubling wait, one second then two, four, up to thirty-two: a
      # minute in all, which is what a gateway timeout on GitHub's download front takes to
      # clear. A fixed two seconds between attempts gives up inside one.
      - name: Install uv
        env:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv versioning=semver
          UV_TAG: 0.12.23
          UV_SHA256: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors \
            --connect-timeout 20 --speed-limit 1024 --speed-time 60 -o "${archive}" \
            "https://github.com/astral-sh/uv/releases/download/${UV_TAG}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"

      # --locked refuses a uv.lock that no longer matches pyproject.toml instead of re-resolving,
      # and the interpreter is the one pyproject.toml pins.
      - name: Install gdtoolkit
        env:
          # The interpreter uv downloads and verifies, never one the runner image happens to have.
          UV_MANAGED_PYTHON: '1'
        run: |
          set -euo pipefail
          uv sync --locked
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      # Bun only runs the package scripts, so the directories gdformat and gdlint cover are
      # written once, in package.json, and are the same here as on a developer's machine.
      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Check formatting
        run: bun run format:gd:check

      - name: Lint
        if: '!cancelled()'
        run: bun run lint:gd

  # The workflows are linted by actionlint and zizmor for what they do; this is for what every
  # YAML file here is as YAML, the syft and yamllint configs included. yamllint is Python, so
  # it is installed the way gdtoolkit is above.
  yaml:
    name: yaml
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        env:
          # renovate: datasource=github-release-attachments depName=astral-sh/uv versioning=semver
          UV_TAG: 0.12.23
          UV_SHA256: 9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 --retry 6 --retry-all-errors \
            --connect-timeout 20 --speed-limit 1024 --speed-time 60 -o "${archive}" \
            "https://github.com/astral-sh/uv/releases/download/${UV_TAG}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/uv-x86_64-unknown-linux-gnu" >> "${GITHUB_PATH}"

      - name: Install yamllint
        env:
          UV_MANAGED_PYTHON: '1'
        run: |
          set -euo pipefail
          uv sync --locked
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Lint
        run: yamllint --strict .

  # Whether the engine legs have anything to test. A release pull request changes the version in
  # package.json and server.json and nothing else; its tree is main's with those two lines, and
  # main's own run already took the engine legs over everything else. Running them again cost
  # ten of the release's minutes and could only find a flake. Judged from the diff, not from the
  # branch name, so a pull request that changes one more line takes the legs as any other does.
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      engine: ${{ steps.scope.outputs.engine }}
    steps:
      # Two commits deep: a pull request is checked out as its merge into the base, whose first
      # parent is the base, so the diff between them is what the pull request changes.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Judge the diff
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          engine=true
          if [[ "${EVENT}" == pull_request ]]; then
            changed="$(git diff --name-only HEAD^1 HEAD | sort | tr '\n' ' ')"
            if [[ "${changed}" == "package.json server.json " ]]; then
              # Every added or removed line, headers aside, has to be a version line.
              others="$(git diff -U0 HEAD^1 HEAD -- package.json server.json \
                | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' \
                | grep -vE '^[+-][[:space:]]*"version": "[0-9]+\.[0-9]+\.[0-9]+",?$' || true)"
              if [[ -z "${others}" ]]; then
                engine=false
              fi
            fi
          fi
          echo "Engine legs needed: ${engine}"
          echo "engine=${engine}" >> "${GITHUB_OUTPUT}"

  # The GDScript that ships in the bundle, driven against a real engine on every platform we
  # claim to support. It is a separate job from build-and-test because it is the only one that
  # needs Godot, and running it on one platform would say nothing about the other two: the
  # things it covers, project.godot writing and path handling, are exactly where the platforms
  # differ. The parts of each platform run at once, on machines of their own; see engine.yml.
  engine-linux-parts:
    name: engine linux
    needs: scope
    if: needs.scope.outputs.engine == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/engine.yml # zizmor: ignore[self-repository]
    with:
      # renovate: datasource=github-runners depName=ubuntu
      runner: ubuntu-24.04
      regression-parts: '["1/3", "2/3", "3/3"]'

  engine-windows-parts:
    name: engine windows
    needs: scope
    if: needs.scope.outputs.engine == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/engine.yml # zizmor: ignore[self-repository]
    with:
      # renovate: datasource=github-runners depName=windows
      runner: windows-2025
      regression-parts: '["1/3", "2/3", "3/3"]'

  engine-macos-parts:
    name: engine macos
    needs: scope
    if: needs.scope.outputs.engine == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/engine.yml # zizmor: ignore[self-repository]
    with:
      # renovate: datasource=github-runners depName=macos
      runner: macos-26
      regression-parts: '["1/3", "2/3", "3/3"]'
      engine-fixtures-in-first-part: true

  # One check per platform, named by platform rather than by runner image, because the name is
  # what the branch ruleset requires, and an image bump must not rename a required check out from
  # under it. Each reports only its own platform's parts, so a Windows failure leaves Linux green.
  # Parts skipped pass only when scope said there was nothing to test, so a scope that failed
  # fails these too rather than passing them unrun.
  engine-linux:
    name: engine (linux)
    needs: [scope, engine-linux-parts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.engine-linux-parts.result }}
          ENGINE: ${{ needs.scope.outputs.engine }}
        run: test "${RESULT}" = success || { test "${ENGINE}" = false && test "${RESULT}" = skipped; }

  engine-windows:
    name: engine (windows)
    needs: [scope, engine-windows-parts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.engine-windows-parts.result }}
          ENGINE: ${{ needs.scope.outputs.engine }}
        run: test "${RESULT}" = success || { test "${ENGINE}" = false && test "${RESULT}" = skipped; }

  engine-macos:
    name: engine (macos)
    needs: [scope, engine-macos-parts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.engine-macos-parts.result }}
          ENGINE: ${{ needs.scope.outputs.engine }}
        run: test "${RESULT}" = success || { test "${ENGINE}" = false && test "${RESULT}" = skipped; }

  # Biome owns formatting and the fast syntactic rules; oxlint owns the ones that need the type
  # checker, which it runs through typescript-go rather than a second copy of the compiler.
  # Separate from build-and-test so a lint failure and a broken build are two different red
  # lights rather than one.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint:biome

      - name: oxlint, type-aware
        if: '!cancelled()'
        run: bun run lint:types

      # A file, export or dependency nothing reaches. Dead code is where the next silent
      # failure hides: it looks maintained and nothing runs it.
      - name: knip
        if: '!cancelled()'
        run: bun run lint:dead

      - name: markdownlint
        if: '!cancelled()'
        run: bun run lint:prose

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      # No package cache: restoring and saving one took twelve seconds against an install of one,
      # and an entry any pull request can write is bytes whose provenance is a cache key.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Runtime regression tests
        run: bun run test:ci

      # The bridge, driven against a mock Godot over a real WebSocket.
      - name: Bridge integration test
        run: bun run test:integration

      - name: Metadata consistency tests
        run: bun run test:metadata

      - name: Packaging test
        run: bun run test:packaging

      - name: Audit production dependencies
        run: bun scripts/audit-production.ts
