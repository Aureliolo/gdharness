name: CI

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta

permissions:
  contents: read

# A superseded run on the same ref tells you nothing the newer one will not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is mechanical and always enforceable, so it gates from day one.
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        # No bun-version input on purpose: setup-bun reads packageManager out of
        # package.json, which is the one place the Bun version is written.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  # The GDScript is what runs inside a user's engine, so it gets the same treatment as the
  # TypeScript in front of it.
  gdscript:
    name: gdscript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install gdtoolkit
        run: pip install gdtoolkit==4.5.0

      - name: Check formatting
        run: gdformat --check --line-length=110 src/godot

      - name: Lint
        if: '!cancelled()'
        run: gdlint src/godot

  # The GDScript that ships in the bundle, driven against a real engine on every platform we
  # claim to support. It is a separate job from build-and-test because it is the only one that
  # needs Godot, and running it on one platform would say nothing about the other two: the
  # things it covers, project.godot writing and path handling, are exactly where the platforms
  # differ.
  engine:
    name: engine
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Ours rather than a setup action's, because the engine is a 180 MB binary and this is the
      # only way to know it is the one the repository pins. It exports GODOT_PATH.
      - name: Install Godot
        run: bun scripts/install-godot.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Engine fixtures
        run: bun run test:engine
        env:
          # The suite skips when it cannot run Godot, which is right on a contributor's machine
          # and wrong here: without this a broken install would read as a pass.
          GDHARNESS_REQUIRE_GODOT: '1'

  # Biome owns formatting and the fast syntactic rules; oxlint owns the ones that need the type
  # checker, which it runs through typescript-go rather than a second copy of the compiler.
  # Separate from build-and-test so a lint failure and a broken build are two different red
  # lights rather than one.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        # No bun-version input on purpose: setup-bun reads packageManager out of
        # package.json, which is the one place the Bun version is written.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint:biome

      - name: oxlint, type-aware
        if: '!cancelled()'
        run: bun run lint:types

  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        # No bun-version input on purpose: setup-bun reads packageManager out of
        # package.json, which is the one place the Bun version is written.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Restore Bun package cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Runtime regression tests
        run: bun run test:ci

      - name: Dynamic groups test
        run: bun run test:dynamic-groups

      - name: Metadata consistency tests
        run: bun run test:metadata

      - name: Packaging test
        run: bun run test:packaging

      - name: Audit production dependencies
        run: bun audit --prod
