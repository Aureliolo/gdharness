name: Tag release

# The second half of the button. A merged release pull request leaves main carrying a version
# that has no tag; this creates it, which is what the release workflow waits for. Keyed on the
# version in package.json rather than on the pull request, so a version that arrives some other
# way still gets tagged exactly once.
on:
  push:
    branches:
      - main
    paths:
      - package.json

permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Creates the tag.
      actions: write # Starts the release workflow on it, since a tag made with this token starts nothing by itself.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Tag the version if it has no tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(bun -e "console.log((await Bun.file('package.json').json()).version)")"
          server_version="$(bun -e "console.log((await Bun.file('server.json').json()).version)")"

          if [[ "${server_version}" != "${version}" ]]; then
            echo "server.json says ${server_version} and package.json says ${version}." >&2
            exit 1
          fi

          if gh api "repos/${GH_REPO}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            # Resolved through commits/ so an annotated tag answers with its commit too. A failing
            # gh api writes the response body to stdout, so it is only run once the ref is known.
            tagged="$(gh api "repos/${GH_REPO}/commits/v${version}" --jq .sha)"

            if [[ "${tagged}" == "${GITHUB_SHA}" ]]; then
              echo "v${version} already points at this commit; nothing to do."
              exit 0
            fi

            echo "v${version} is tagged at ${tagged}, not ${GITHUB_SHA}, so this version cannot" >&2
            echo "be released. The fork inherited GoPeak's tags: v1.1.0 and the v2 line are taken." >&2
            exit 1
          fi

          gh api "repos/${GH_REPO}/git/refs" \
            -f "ref=refs/tags/v${version}" \
            -f "sha=${GITHUB_SHA}"
          echo "Tagged v${version} at ${GITHUB_SHA}."

          # An event caused by the job token starts no workflow, so the tag push above is
          # invisible to the release workflow's trigger; a dispatch is not.
          gh workflow run release.yml --ref "v${version}"
          echo "Started the release workflow on v${version}."
