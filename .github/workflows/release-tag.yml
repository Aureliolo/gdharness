name: Tag release

# The second half of the button. A merged release pull request leaves main carrying a version
# that has no tag; this creates it, which is what the release workflow waits for. Keyed on the
# version in package.json rather than on the pull request, so a version that arrives some other
# way still gets tagged exactly once.
on:
  push:
    branches:
      - main
    paths:
      - package.json
  # The way back when a tag was made and the release behind it did not happen. The tag is deleted
  # and this is run again, which cannot go through the push trigger: the version has to change for
  # that to fire, and recovering a release means tagging the same version at a commit that works.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Creates the tag.
      actions: write # Starts the release workflow on it, since a tag made with this token starts nothing by itself.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # The parent too, so the step below can see whether the version moved.
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Tag the version if it has no tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version="$(bun -e "console.log((await Bun.file('package.json').json()).version)")"
          server_version="$(bun -e "console.log((await Bun.file('server.json').json()).version)")"

          if [[ "${server_version}" != "${version}" ]]; then
            echo "server.json says ${server_version} and package.json says ${version}." >&2
            exit 1
          fi

          # package.json is edited for all sorts of reasons: a script, a dependency, a pin. Only a
          # change to the version is a release, so anything else stops here rather than reaching
          # the tag check below and being reported as a release that cannot happen.
          #
          # Skipped when a person asked for this by hand, because that is the recovery case: the
          # version is the same as it was and the point is to tag it somewhere that works. The tag
          # check below still refuses to move a tag that exists, so asking for this twice is safe.
          if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
            git show "${GITHUB_SHA}^:package.json" > parent-package.json 2>/dev/null \
              || echo '{}' > parent-package.json
            previous="$(bun -e "console.log((await Bun.file('parent-package.json').json()).version ?? '')")"
            rm -f parent-package.json

            if [[ "${previous}" == "${version}" ]]; then
              echo "package.json changed, but the version is still ${version}. Not a release."
              exit 0
            fi
          fi

          if gh api "repos/${GH_REPO}/git/ref/tags/v${version}" >/dev/null 2>&1; then
            # Resolved through commits/ so an annotated tag answers with its commit too. A failing
            # gh api writes the response body to stdout, so it is only run once the ref is known.
            tagged="$(gh api "repos/${GH_REPO}/commits/v${version}" --jq .sha)"

            if [[ "${tagged}" != "${GITHUB_SHA}" ]]; then
              echo "v${version} is tagged at ${tagged}, not ${GITHUB_SHA}, so this version cannot" >&2
              echo "be released. Nothing can move that tag; raise the version past it." >&2
              exit 1
            fi

            if [[ "${EVENT_NAME}" != "workflow_dispatch" ]]; then
              echo "v${version} already points at this commit; nothing to do."
              exit 0
            fi

            # Asked for by hand with the tag already made. The tag is not what was missing, so
            # this is the recovery case, and falling through to the dispatch below is the whole
            # point of it: the tag and the dispatch are two steps of one act, and a run that made
            # the tag and did not reach the dispatch leaves nothing else able to start the
            # release. Stopping here because the tag exists would have made this button do
            # nothing in exactly the state somebody presses it.
            echo "v${version} is already tagged at this commit."
          else
            gh api "repos/${GH_REPO}/git/refs" \
              -f "ref=refs/tags/v${version}" \
              -f "sha=${GITHUB_SHA}"
            echo "Tagged v${version} at ${GITHUB_SHA}."
          fi

          # An event caused by the job token starts no workflow, so the tag push above is
          # invisible to the release workflow's trigger; a dispatch is not.
          gh workflow run release.yml --ref "v${version}"
          echo "Started the release workflow on v${version}."
