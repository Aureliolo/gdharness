name: Engine

# The GDScript that ships in the bundle, driven against a real engine, for one platform per call.
# The work is split into parts that run at once, each on its own machine: the regressions in as
# many parts as the caller names, the engine fixtures, and the editor fixtures with the bridge
# test. Run one after another on one machine they took 23 minutes on Windows, nearly all of it
# waiting on Godot processes. The regressions are split by measured weight (test/support/shards.ts),
# so the parts finish together rather than one waiting on the heaviest tests.
on:
  workflow_call:
    inputs:
      runner:
        description: The runner image this platform's parts run on.
        type: string
        required: true
      regression-parts:
        description: The regression parts as a JSON list of k/n, such as ["1/3", "2/3", "3/3"].
        type: string
        required: true
      engine-fixtures-with-editor-fixtures:
        description: >-
          Run the engine fixtures on the editor fixtures' machine rather than their own. For macOS,
          where GitHub runs five jobs at once for the account: a run asking for five queued behind any
          other holding one, a pull request's beside main's or the release's install check beside the
          release commit's, for up to eight minutes. That machine has the room: its editor fixtures
          take about six minutes, while a regression part carrying the fixtures, which took from 370
          to 491 seconds between runs of the same code, reached its twenty-minute limit.
        type: boolean
        default: false

permissions: {}

jobs:
  regressions:
    name: regressions ${{ matrix.part }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    permissions:
      contents: read # Reads the source it tests.
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.regression-parts) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      # Ours rather than a setup action's, because the engine is a 180 MB binary and this is the
      # only way to know it is the one the repository pins. It exports GODOT_PATH.
      - name: Install Godot
        run: bun scripts/install-godot.ts

      # The test runner project_test drives, pinned by commit and digest the same way. It
      # exports GDUNIT4_PATH, and the regression that needs it fails rather than skips here.
      - name: Install gdUnit4
        run: bun scripts/install-gdunit4.ts

      - name: Install dependencies
        run: bun scripts/install-packages.ts

      # The suites start servers from the bundle.
      - name: Build
        run: bun run build

      # The regressions that drive the scene tools through the engine skip without one, so they
      # are run again here, where a skip is a failure. A job its own limit ends keeps no log, so
      # the run is given twenty minutes, names what it was running and never reached when they
      # run out, and ends itself; the step's limit after that keeps the log of a run so stuck it
      # cannot, and the job's leaves the steps before it their time. A part takes about twelve.
      - name: Regressions that need the engine
        run: bun run test:regressions
        timeout-minutes: 22
        env:
          GDHARNESS_REQUIRE_GODOT: '1'
          GDHARNESS_REGRESSION_SHARD: ${{ matrix.part }}
          GDHARNESS_REGRESSION_BUDGET_MS: '1200000'

  fixtures:
    name: ${{ matrix.part }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    permissions:
      contents: read # Reads the source it tests.
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.engine-fixtures-with-editor-fixtures && '["editor fixtures"]' || '["engine fixtures", "editor fixtures"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Install Godot
        run: bun scripts/install-godot.ts

      - name: Install gdUnit4
        run: bun scripts/install-gdunit4.ts

      - name: Install dependencies
        run: bun scripts/install-packages.ts

      # The editor fixtures start servers from the bundle; the engine fixtures run GDScript alone.
      - name: Build
        if: matrix.part == 'editor fixtures'
        run: bun run build

      # The bridge test's ClassDB phase reaches the engine and skips without one, so it is run
      # again here, where a skip is a failure.
      - name: Bridge integration test with the engine
        if: matrix.part == 'editor fixtures'
        run: bun run test:integration
        env:
          GDHARNESS_REQUIRE_GODOT: '1'

      # The editor tools, against an editor this starts itself. Nothing else in CI opens one, so
      # without this every scene_* tool, resource_edit and editor_rescan is covered by argument
      # checks alone, which a tool answering plausible nonsense passes as well as a working one.
      - name: Editor fixtures
        if: matrix.part == 'editor fixtures' && !cancelled()
        run: bun run test:editor
        env:
          GDHARNESS_REQUIRE_GODOT: '1'

      # Last, because the bridge test runs only after every step before it passed, and on a machine
      # running both a failing engine fixture would otherwise keep it from running.
      - name: Engine fixtures
        if: (matrix.part == 'engine fixtures' || inputs.engine-fixtures-with-editor-fixtures) && !cancelled()
        run: bun run test:engine
        env:
          # The suite skips when it cannot run Godot, which is right on a contributor's machine
          # and wrong here: without this a broken install would read as a pass.
          GDHARNESS_REQUIRE_GODOT: '1'
