name: Prepare release

# Cutting a tag by hand is the one release step nobody can check afterwards, and it is the step
# most often done at the wrong time, from the wrong branch, against the wrong version. This puts
# it behind a button: pick the bump, and out comes a branch with the signed version commit and a
# pull request for it. Merge that and the tagging and publishing follow, with nobody typing a
# version again.
#
# The checks on that pull request are created in an approval-required state and wait for a click.
# That is GitHub's rule for anything a workflow opens with the job token: the runs exist, they
# are held, and a banner in the merge box offers "Approve workflows to run". Getting them to
# start by themselves would mean a GitHub App or a personal access token, which is a standing
# credential bought to save one click.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: An exact version instead, such as 1.0.0. Overrides the bump above.
        required: false
        type: string

permissions: {}

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Creates the release branch and the signed version-bump commit on it.
      pull-requests: write # Opens the release pull request for that branch.

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Raise the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The files the bump wrote, from the script's own report: the README is only among
          # them while it pins a version, and the commit and the pull request name what changed.
          bumped="$(bun scripts/bump-version.ts "${VERSION:-$BUMP}" | tee /dev/stderr)"
          files="$(sed -n 's/^Updated: //p' <<<"${bumped}")"
          test -n "${files}"
          next="$(bun -e "console.log((await Bun.file('package.json').json()).version)")"
          {
            echo "version=${next}"
            echo "branch=release/v${next}"
            echo "files=${files}"
          } >> "${GITHUB_OUTPUT}"

      # A tag rather than a release: a version can be tagged with no release attached, and the
      # tag ruleset lets nothing move or delete one, so that number is spent either way.
      - name: Refuse a version whose tag is taken
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already tagged. Pick a version whose tag is free." >&2
            exit 1
          fi

      - name: Open the branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/git/refs" \
            -f "ref=refs/heads/${BRANCH}" \
            -f "sha=${GITHUB_SHA}"

      - name: Commit the bump
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_OID: ${{ github.sha }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          VERSION: ${{ steps.bump.outputs.version }}
          FILES: ${{ steps.bump.outputs.files }}
        run: |
          set -euo pipefail
          # Word-split on purpose: the report is a comma-separated list of paths without spaces.
          # shellcheck disable=SC2086
          bun scripts/commit-signed.ts "${BRANCH}" "Release v${VERSION}" ${FILES//,/ }

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          VERSION: ${{ steps.bump.outputs.version }}
          FILES: ${{ steps.bump.outputs.files }}
        run: |
          set -euo pipefail
          # The last comma read as "and": "package.json, server.json" names two files.
          named="${FILES}"
          if [[ "${FILES}" == *", "* ]]; then
            named="${FILES%, *} and ${FILES##*, }"
          fi
          body="Raises the version to ${VERSION} in ${named}."
          body="${body} Merging this tags v${VERSION}, which builds, signs and publishes the release."

          # The label is what keeps this pull request out of the next release's notes, which
          # .github/release.yml excludes by. It has to exist in the repository: gh fails the
          # whole command on a label it cannot find, so deleting it would stop a release being
          # prepared rather than quietly put the line back.
          url="$(gh pr create --base main --head "${BRANCH}" --label release \
            --title "Release v${VERSION}" --body "${body}")"

          {
            echo "## Release v${VERSION}"
            echo
            echo "${url}"
            echo
            echo 'Its checks are waiting on **Approve workflows to run** in the merge box.'
            echo 'Approve them, and merge once they are green: that tags and publishes.'
          } >> "${GITHUB_STEP_SUMMARY}"
