name: Prepare release

# Cutting a tag by hand is the one release step nobody can check afterwards, and it is the step
# most often done at the wrong time, from the wrong branch, against the wrong version. This puts
# it behind a button: pick the bump, get a branch with the signed version commit, open the pull
# request it prints, merge it. Tagging and publishing follow from the merge without anyone
# typing a version again.
#
# The pull request is opened by a person and not here: a pull request opened with the job token
# starts no workflow, so nothing would check it and the merge would stay blocked.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: An exact version instead, such as 1.0.0. Overrides the bump above.
        required: false
        type: string

permissions: {}

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Creates the release branch and the signed version-bump commit on it.

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Install Bun
        uses: ./.github/actions/install-bun # zizmor: ignore[self-repository]

      - name: Raise the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun scripts/bump-version.ts "${VERSION:-$BUMP}"
          next="$(bun -e "console.log((await Bun.file('package.json').json()).version)")"
          echo "version=${next}" >> "${GITHUB_OUTPUT}"
          echo "branch=release/v${next}" >> "${GITHUB_OUTPUT}"

      # A tag rather than a release: the fork inherited GoPeak's tags, so v1.1.0 and the whole
      # v2 line are taken here without ever having been released from this repository, and the
      # tag ruleset does not let anything move or delete them.
      - name: Refuse a version whose tag is taken
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GH_REPO}/git/ref/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already tagged. Pick a version whose tag is free." >&2
            exit 1
          fi

      - name: Open the branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.bump.outputs.branch }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/git/refs" \
            -f "ref=refs/heads/${BRANCH}" \
            -f "sha=${GITHUB_SHA}"

      - name: Commit the bump
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_OID: ${{ github.sha }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          bun scripts/commit-signed.ts "${BRANCH}" "Release v${VERSION}" \
            package.json server.json README.md

      - name: Say how to open the pull request
        env:
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          body="Raises the version to ${VERSION} in package.json, server.json and the README."
          body="${body} Merging this tags v${VERSION}, which builds, signs and publishes the release."
          {
            echo "## Release v${VERSION} is ready on \`${BRANCH}\`"
            echo
            echo "Open the pull request, which starts the checks, and merge it to tag and publish:"
            echo
            echo '```sh'
            echo "gh pr create --repo ${GH_REPO} --base main --head ${BRANCH} \\"
            echo "  --title 'Release v${VERSION}' \\"
            echo "  --body '${body}'"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
