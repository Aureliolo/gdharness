name: Attest

# Attestation lives in its own reusable workflow rather than inline in the release job, and
# that separation is the whole difference between SLSA Build Level 2 and Level 3: the signing
# runs somewhere the build cannot reach, so the identity in the certificate names this workflow
# rather than whatever the release job happened to be doing. A verifier can then insist the
# provenance came from here, which is a claim that means something; "some job in this repo
# signed it" is not.
on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the uploaded artifact holding the files to attest
        required: true
        type: string
      subjects:
        description: Newline-separated paths inside that artifact to attest
        required: true
        type: string
      sbom:
        description: Path inside the artifact of the SBOM describing the archive
        required: true
        type: string
      archive:
        description: Path inside the artifact of the archive the SBOM describes
        required: true
        type: string
      bundle:
        description: File name the signed attestations are uploaded under, as JSON Lines
        required: true
        type: string

permissions: {}

jobs:
  attest:
    name: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The identity in the OIDC token is this workflow rather than the one that built the
    # archive, which is what makes the provenance worth reading and why this job lives apart.
    permissions:
      id-token: write # Sigstore signs against this token.
      attestations: write # Writes the provenance onto the repository.

    steps:
      - name: Download the artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact }}
          path: dist

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ inputs.subjects }}

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ inputs.archive }}
          sbom-path: ${{ inputs.sbom }}

      # The attestations are stored on the repository too, but only a verifier with GitHub's
      # API reaches them there. A copy beside the archive verifies from the file alone
      # (`gh attestation verify --bundle`), and it is the only form OpenSSF Scorecard counts as
      # a signed release.
      - name: Gather the signed attestations into one file
        env:
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM: ${{ steps.sbom.outputs.bundle-path }}
          BUNDLE: ${{ inputs.bundle }}
        run: |
          set -euo pipefail
          mkdir -p attestations
          cat "${PROVENANCE}" "${SBOM}" > "attestations/${BUNDLE}"
          lines=$(wc -l < "attestations/${BUNDLE}")
          if [ "${lines}" -ne 2 ]; then
            echo "Expected one provenance and one SBOM attestation, found ${lines} lines." >&2
            exit 1
          fi

      - name: Upload the signed attestations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attestations
          path: attestations/${{ inputs.bundle }}
          if-no-files-found: error
          retention-days: 1
