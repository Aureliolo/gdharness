# What the generated notes leave out.
#
# The version-bump pull request is not something a release carries: it is the release. Left in,
# every set of notes ends with "Release v0.12.3", which tells a reader that this release released
# itself and pushes the line that does say something up out of sight.
#
# By the label, which is the mechanism this was checked against: generating the notes for a tag
# whose target carries this file drops the labelled pull request, and the header GitHub writes
# says which commit the configuration came from. release-prepare.yml puts the label on, and it is
# the only thing that opens one of these.
#
# That "which commit" is the part worth knowing: the configuration is read from the release's
# target, not from the default branch as it is now. So a tag cut before a change here was made
# does not see it, and regenerating an old tag's notes to check a change tests the old file.
# Excluding the author was tried first and read as not working for exactly that reason, against a
# tag that predated it, which is a null result rather than a verdict.
#
# Dependency updates stay in. This is distributed as a bundle, so a raised dependency is a change
# in what somebody installs, and a reader deciding whether to take a release should see it.
changelog:
  exclude:
    labels:
      - release
