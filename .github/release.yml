# What the generated notes leave out.
#
# The version-bump pull request is not something a release carries: it is the release. Left in,
# every set of notes ends with "Release v0.12.3", which tells a reader that this release released
# itself and pushes the line that does say something up out of sight.
#
# By the label rather than by the author. Excluding `github-actions[bot]`, and `github-actions`
# beside it, left the line exactly where it was: whatever `exclude.authors` matches, it is not
# either spelling of an app that opens a pull request with the job token. The label is put on by
# release-prepare.yml, which is the only thing that opens one of these, and it is the mechanism
# this was checked against rather than the one that reads as though it should work.
#
# Dependency updates stay in. This is distributed as a bundle, so a raised dependency is a change
# in what somebody installs, and a reader deciding whether to take a release should see it.
changelog:
  exclude:
    labels:
      - release
